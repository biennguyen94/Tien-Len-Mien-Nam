# PostgreSQL for development and tests only (decision A4).
# Separate from the OpenMU database (host port 5433) and from production.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Databases: tien_len_dev (mix phx.server), tien_len_test (mix test). Created by `mix ecto.create`.
name: tien-len-dev

services:
  dev-db:
    image: postgres:latest
    container_name: tien-len-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tien_len
      POSTGRES_PASSWORD: tien_len_dev_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tien-len-dev-db:/var/lib/postgresql

volumes:
  tien-len-dev-db:
